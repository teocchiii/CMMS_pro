version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cmms-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cmms_user
      POSTGRES_PASSWORD: cmms_password
      POSTGRES_DB: cmms_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmms_user -d cmms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmms-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cmms_db
      - SPRING_DATASOURCE_USERNAME=cmms_user
      - SPRING_DATASOURCE_PASSWORD=cmms_password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - JWT_SECRET=CMMSSecretKeyParaFirmaDeToken2024MuySeguraYSuperLargaParaEvitarVulnerabilidades!
      - JWT_EXPIRATION=86400000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
