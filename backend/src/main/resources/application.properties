spring.application.name=cmms-backend

# Database Configuration (H2 in-memory instead of PostgreSQL because Docker is off)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:cmms_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:cmms_user}
spring.datasource.password=${DB_PASSWORD:cmms_password}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# JWT Secret
jwt.secret=94a08da1fecbb6e8b46990538c7b50b2a8d38865e94b281f9640ab212bb60cb0
jwt.expirationMs=86400000

# Server
server.port=8080
server.error.include-message=always

# Mail Configuration (Mailtrap or dummy for dev)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=dummy_user
spring.mail.password=dummy_pass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
